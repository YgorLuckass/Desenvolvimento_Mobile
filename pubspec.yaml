name: finance_app
description: Aplicativo de controle financeiro pessoal.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Estado
  flutter_riverpod: ^2.5.1
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  # Banco local
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^0.4.3+2
  path: ^1.9.1
  # API e rede
  http: ^1.2.2
  connectivity_plus: ^6.0.3
  # UI
  fl_chart: ^0.66.2
  shimmer: ^3.0.0
  intl: ^0.18.1
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true